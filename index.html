<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Vintage Boutique — Prendas</title>
<meta name="theme-color" content="#123B36">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prendas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --ink:#211C18;
    --cream:#FBF7F0;
    --teal:#123B36;
    --teal-dark:#0B2723;
    --mustard:#D69A2D;
    --mustard-dark:#B37F1E;
    --line:#E4DCCB;
    --sold:#B0413E;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    font-size:16px;
    overscroll-behavior-y:contain;
    -webkit-user-select:none;user-select:none;
  }
  input,textarea{-webkit-user-select:text;user-select:text}
  #app{min-height:100dvh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}

  /* ---------- Encabezado ---------- */
  .hdr{
    background:var(--teal);color:var(--cream);
    padding:calc(18px + env(safe-area-inset-top)) 20px 16px;
    display:flex;align-items:center;gap:12px;
    position:sticky;top:0;z-index:20;
  }
  .hdr-logo{display:flex;flex-shrink:0}
  .hdr-logo img{height:38px;width:auto;display:block}
  .hdr h1{font-size:19px;margin:0;line-height:1.15;font-weight:800}
  .hdr .sub{font-size:13px;opacity:.78;margin-top:2px}
  .hdr .spacer{flex:1}
  .iconbtn{
    background:rgba(255,255,255,.14);border:0;color:inherit;
    width:42px;height:42px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    cursor:pointer;transition:transform .1s;
  }
  .iconbtn:active{transform:scale(.9)}
  .iconbtn svg{width:22px;height:22px}

  /* ---------- Estado de sincronización ---------- */
  .sync{
    display:flex;align-items:center;gap:8px;
    font-size:12.5px;padding:8px 20px;
    background:#fff;border-bottom:1px solid var(--line);color:var(--ink);
  }
  .sync .dot{width:9px;height:9px;border-radius:50%;background:#5B9E6B;flex-shrink:0}
  .sync.pend .dot{background:var(--mustard)}
  .sync.off .dot{background:#9A938A}
  .sync .txt{opacity:.75}

  /* ---------- Contenido ---------- */
  .body{flex:1;padding:16px 20px 110px}

  /* ---------- Filtros ---------- */
  .filtros{display:flex;gap:8px;margin-bottom:16px}
  .chip{
    flex:1;padding:11px 8px;border-radius:99px;border:2px solid var(--line);
    background:#fff;color:var(--ink);font-size:14px;font-weight:700;
    cursor:pointer;transition:transform .1s;
  }
  .chip:active{transform:scale(.96)}
  .chip.on{background:var(--teal);border-color:var(--teal);color:var(--cream)}

  /* ---------- Grid de prendas ---------- */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
  @media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
  .card{background:#fff;border:2px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
  .card .ph{position:relative;background:var(--line);container-type:inline-size}
  .card .ph img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
  /* Franja VENDIDO: centrada, ancha, justo encima del precio de la foto */
  .badge{
    position:absolute;left:0;right:0;bottom:20.5%;
    background:var(--sold);color:#fff;text-align:center;
    font-weight:900;letter-spacing:.14em;font-size:15px;padding:3.2% 0;
  }
  @container (min-width:1px){ .badge{ font-size:11cqw; padding:3.2cqw 0 } }
  .card .info{padding:10px 10px 11px}
  /* Un renglón por prenda dentro de la misma foto */
  .renglon{display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px solid var(--line)}
  .renglon:last-of-type{border-bottom:0;margin-bottom:6px}
  .renglon.vend{opacity:.5}
  .renglon.vend .tx b{text-decoration:line-through}
  .renglon .num{
    flex:0 0 20px;height:20px;border-radius:50%;background:var(--mustard);color:var(--teal-dark);
    font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;
  }
  .renglon.vend .num{background:var(--sold);color:#fff}
  .renglon .tx{flex:1;min-width:0;display:block}
  .renglon .tx b{display:block;font-size:16px;font-weight:800;color:var(--teal);line-height:1.15}
  .renglon .tx i{display:block;font-style:normal;font-size:11px;opacity:.72;line-height:1.25;margin-top:1px}
  .renglon .tg{
    flex:0 0 34px;height:34px;border-radius:10px;border:0;background:var(--mustard);
    color:var(--teal-dark);display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .renglon .tg.done{background:var(--cream);color:var(--teal);border:2px solid var(--teal)}
  .renglon .tg:active{transform:scale(.92)}
  .renglon .tg svg{width:17px;height:17px}

  .card-acciones{display:flex;gap:6px}
  .mini{
    border:0;border-radius:10px;padding:9px 4px;font-size:12px;font-weight:800;
    display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;transition:transform .1s;
  }
  .mini:active{transform:scale(.95)}
  .mini svg{width:14px;height:14px}
  .mini.s{flex:1;background:var(--teal);color:var(--cream)}
  .mini.b{flex:0 0 40px;background:transparent;color:var(--sold)}

  /* Marcadores numerados sobre la miniatura */
  .pin{
    position:absolute;transform:translate(-50%,-50%);
    width:24px;height:24px;border-radius:50%;background:var(--mustard);color:var(--teal-dark);
    border:2px solid var(--cream);box-shadow:0 2px 6px rgba(11,39,35,.4);
    font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;
  }
  .pin.v{background:var(--sold);color:#fff}
  .pin.gr{width:38px;height:38px;font-size:17px;cursor:pointer}
  .pin.gr.pend{background:var(--cream);color:var(--sold);border-color:var(--sold)}

  /* ---------- Vacío ---------- */
  .vacio{text-align:center;padding:70px 20px;opacity:.6}
  .vacio svg{width:44px;height:44px;color:var(--teal);margin-bottom:12px}

  /* ---------- Botón grande ---------- */
  .big{
    width:100%;display:flex;align-items:center;gap:15px;border:0;
    border-radius:18px;padding:15px 18px;cursor:pointer;text-align:left;
    transition:transform .1s;font-family:inherit;
  }
  .big:active{transform:scale(.98)}
  .big:disabled{opacity:.38;transform:none}
  .big .ic{
    width:47px;height:47px;border-radius:50%;background:rgba(255,255,255,.18);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .big .ic svg{width:25px;height:25px}
  .big .lbl{display:block;font-weight:800;font-size:17px;line-height:1.15}
  .big .sub{display:block;font-size:12.5px;opacity:.82;margin-top:3px;line-height:1.25}
  .big.teal{background:var(--teal);color:var(--cream)}
  .big.mustard{background:var(--mustard);color:var(--teal-dark)}
  .big.mustard .ic{background:rgba(11,39,35,.14)}
  .big.ghost{background:#fff;color:var(--teal);border:2px solid var(--teal)}
  .big.ghost .ic{background:rgba(18,59,54,.09)}

  /* ---------- FAB ---------- */
  .fab{
    position:fixed;right:20px;bottom:calc(22px + env(safe-area-inset-bottom));
    width:66px;height:66px;border-radius:50%;border:0;background:var(--mustard);
    color:var(--teal-dark);box-shadow:0 6px 20px rgba(33,28,24,.28);
    display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:30;
    transition:transform .1s;
  }
  .fab:active{transform:scale(.9)}
  .fab svg{width:31px;height:31px}

  /* ---------- Pasos ---------- */
  .pasos{display:flex;gap:7px;padding:14px 20px 0}
  .pasos i{flex:1;height:6px;border-radius:99px;background:var(--line)}
  .pasos i.on{background:var(--mustard)}

  /* ---------- Formulario ---------- */
  .campo{margin-bottom:18px}
  .campo label{display:block;font-weight:800;font-size:12.5px;text-transform:uppercase;
    letter-spacing:.6px;color:var(--teal);margin-bottom:7px}
  .campo label .opt{font-weight:500;text-transform:none;letter-spacing:0;opacity:.6}
  .campo input{
    width:100%;border:2px solid var(--line);border-radius:14px;background:#fff;
    padding:14px 16px;font-size:18px;color:var(--ink);font-family:inherit;outline:0;
  }
  .campo input:focus{border-color:var(--teal)}
  .campo input.grande{font-size:26px;font-weight:800;padding:13px 16px}
  .ayuda{font-size:11.5px;opacity:.6;margin:6px 2px 0;line-height:1.35}
  /* ---------- Paso 2: marcar prendas sobre la foto ---------- */
  .marcador{position:relative;border-radius:18px;overflow:hidden;border:2px solid var(--line);background:#fff}
  /* Sin object-fit ni max-height: así la caja del <img> coincide exactamente
     con la foto y el toque cae donde la vendedora ve la prenda. */
  .marcador img{width:100%;height:auto;display:block;background:var(--ink)}
  .detectando{
    position:absolute;inset:0;background:rgba(11,39,35,.62);color:var(--cream);
    display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:14px;
  }
  .spin{
    width:20px;height:20px;border-radius:50%;border:3px solid rgba(251,247,240,.3);
    border-top-color:var(--mustard);animation:g .8s linear infinite;
  }
  @keyframes g{to{transform:rotate(360deg)}}

  .listaP{display:flex;flex-direction:column;gap:8px;margin:14px 0 4px}
  .itemP{
    display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);
    border-radius:14px;padding:10px 12px;cursor:pointer;
  }
  .itemP.pend{border-color:var(--sold);border-style:dashed}
  .itemP .num{
    flex:0 0 26px;height:26px;border-radius:50%;background:var(--mustard);color:var(--teal-dark);
    font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;
  }
  .itemP.pend .num{background:var(--sold);color:#fff}
  .itemP .tx{flex:1;min-width:0}
  .itemP .tx b{display:block;font-size:15px;font-weight:800;color:var(--teal)}
  .itemP .tx i{display:block;font-style:normal;font-size:12px;opacity:.7;margin-top:1px}
  .itemP .ed{flex:0 0 20px;color:var(--teal);opacity:.55}
  .itemP .ed svg{width:18px;height:18px;display:block}

  .tipos{display:flex;flex-wrap:wrap;gap:7px}
  .tipos button{
    border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:99px;
    padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .tipos button.on{background:var(--teal);border-color:var(--teal);color:var(--cream)}

  /* Hoja del editor de prenda */
  .hoja{
    background:var(--cream);border-radius:24px 24px 0 0;padding:20px 20px 22px;
    width:100%;max-height:92dvh;overflow-y:auto;margin-top:auto;
  }
  .hoja-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .hoja-hdr b{font-size:18px;color:var(--teal)}
  .hoja-pie{display:flex;gap:10px;margin-top:4px}
  .hoja-pie button{
    flex:1;border:0;border-radius:14px;padding:14px;font-size:15px;font-weight:800;
    cursor:pointer;font-family:inherit;
  }
  .iconbtn.chico{width:36px;height:36px;background:rgba(18,59,54,.1);color:var(--teal)}
  .iconbtn.chico svg{width:18px;height:18px}

  /* ---------- Cámara en la app ---------- */
  .camara{position:fixed;inset:0;z-index:90;background:#000;display:flex;flex-direction:column}
  .camara video{flex:1;width:100%;height:100%;object-fit:cover}
  .cam-guia{
    position:absolute;left:8%;right:8%;top:11%;bottom:22%;
    border:2px dashed rgba(251,247,240,.35);border-radius:20px;pointer-events:none;
  }
  .cam-tip{
    position:absolute;top:calc(16px + env(safe-area-inset-top));left:0;right:0;text-align:center;
    color:rgba(251,247,240,.9);font-size:13px;font-weight:700;pointer-events:none;
  }
  .cam-barra{
    position:absolute;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom));
    display:flex;align-items:center;justify-content:space-around;
  }
  .cam-ic{
    width:52px;height:52px;border-radius:50%;border:0;background:rgba(251,247,240,.18);
    color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .cam-ic svg{width:24px;height:24px}
  .cam-obt{
    width:78px;height:78px;border-radius:50%;border:5px solid rgba(251,247,240,.85);
    background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .cam-obt span{width:60px;height:60px;border-radius:50%;background:var(--cream);display:block}
  .cam-obt:active span{transform:scale(.88)}

  .previa{width:100%;border-radius:18px;border:2px solid var(--line);display:block;background:#fff}
  .pie{font-size:11.5px;text-align:center;opacity:.6;margin:10px 0 0}
  .acciones{display:flex;flex-direction:column;gap:11px;margin-top:16px}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(102px + env(safe-area-inset-bottom));
    background:var(--ink);color:var(--cream);padding:13px 22px;border-radius:99px;
    font-size:14px;font-weight:700;box-shadow:0 6px 20px rgba(33,28,24,.3);z-index:60;
    max-width:88vw;text-align:center;
  }

  /* ---------- Modal ---------- */
  .velo{
    position:fixed;inset:0;background:rgba(11,39,35,.55);z-index:70;
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  #editor{padding:0;align-items:flex-end}
  .modal{background:var(--cream);border-radius:22px;padding:24px;max-width:340px;width:100%}
  .modal h3{margin:0 0 8px;font-size:19px;color:var(--teal)}
  .modal p{margin:0 0 20px;font-size:14.5px;line-height:1.45;opacity:.8}
  .modal .fila{display:flex;gap:10px}
  .modal .fila button{
    flex:1;border:0;border-radius:14px;padding:14px;font-size:15px;font-weight:800;
    cursor:pointer;font-family:inherit;
  }
  .btn-no{background:#fff;color:var(--teal);border:2px solid var(--line)!important}
  .btn-si{background:var(--sold);color:#fff}
  .btn-ok{background:var(--teal);color:var(--cream)}

  /* ---------- Selector de tienda (primer arranque) ---------- */
  .bienvenida{
    min-height:100dvh;display:flex;flex-direction:column;justify-content:center;
    padding:32px 26px;gap:14px;background:var(--teal);color:var(--cream);
  }
  .bienvenida img{width:230px;max-width:70%;margin:0 auto 10px;display:block}
  .bienvenida h2{text-align:center;font-size:21px;margin:8px 0 2px}
  .bienvenida p{text-align:center;font-size:14.5px;opacity:.8;margin:0 0 18px;line-height:1.45}
  .oculto{display:none!important}
</style>
</head>
<body>
<div id="app"></div>

<!-- Lienzo de composición (fuera de pantalla hasta que se usa) -->
<canvas id="lienzo" class="oculto"></canvas>
<input id="filein" type="file" accept="image/*" capture="environment" class="oculto">

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
